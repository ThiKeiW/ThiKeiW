<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="250" height="402" viewBox="0 0 250 402" xmlns:c2pa="http://c2pa.org/manifest">
<style>
.s{stroke:#1f2328;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.t{fill:#1f2328;font-family:'Segoe UI',Arial,sans-serif}
.m{fill:#57606a;font-family:'Segoe UI',Arial,sans-serif}
.h{fill:#1f2328;font-family:Impact,'Arial Narrow Bold','Arial Black',sans-serif}
.g{fill:#4A5D23;font-family:Georgia,'Times New Roman',serif;font-style:italic}
@media (prefers-color-scheme: dark){
.s{stroke:#e6edf3}.t{fill:#e6edf3}.m{fill:#9198a1}.h{fill:#e6edf3}.g{fill:#7E9A4F}
