<rect class="s" x="1.5" y="1.5" width="237" height="379" rx="10"/>
<text class="t" x="22" y="44" font-size="22" font-weight="700">Sobre mí</text>
<line class="s" x1="22" y1="56" x2="96" y2="56"/>
<text class="t" x="22" y="96" font-size="14" xml:space="preserve">Hola, soy Kevin Chate,</text>
<text class="t" x="22" y="117" font-size="14" xml:space="preserve">alias ThiKeiW.</text>
<text class="t" x="22" y="148" font-size="14" xml:space="preserve">•  Estudiante de Ingeniería</text>
<text class="t" x="22" y="169" font-size="14" xml:space="preserve">    de Software.</text>
<text class="t" x="22" y="190" font-size="14" xml:space="preserve">•  Me gusta construir cosas</text>
<text class="t" x="22" y="211" font-size="14" xml:space="preserve">    que resuelvan problemas</text>
<text class="t" x="22" y="232" font-size="14" xml:space="preserve">    reales.</text>
<text class="t" x="22" y="253" font-size="14" xml:space="preserve">•  Aprendiendo backend y la</text>
<text class="t" x="22" y="274" font-size="14" xml:space="preserve">    nube a base de proyectos.</text>
<text class="t" x="22" y="295" font-size="14" xml:space="preserve">•  Busco mi primera práctica</text>
<text class="t" x="22" y="316" font-size="14" xml:space="preserve">    preprofesional.</text>
<text class="t" x="22" y="337" font-size="14" xml:space="preserve">•  Fuera del código:</text>
<text class="t" x="22" y="358" font-size="14" xml:space="preserve">    videojuegos y música.</text>

<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
